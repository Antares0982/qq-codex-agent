[project]
name = "qq-codex-agent"
version = "0.1.0"
description = "Personal QQ agent backed by the local Codex runtime"
requires-python = ">=3.13"
dependencies = [
    "openai-codex==0.159.2",
    "aiohttp>=3.12,<4",
    "pillow>=11,<13",
]

[dependency-groups]
dev = [
    "pyright==1.1.414",
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
]

[tool.pyright]
include = ["*.py", "qq_agent", "pics"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"

[tool.pytest.ini_options]
testpaths = ["test_agent.py", "test_images.py", "test_auth.py", "test_runtime.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[project.scripts]
qq-codex-agent = "qq_codex_agent:main"
codex-auth = "qq_agent.auth:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["qq_codex_agent", "image_tool", "image_assets"]
packages = ["pics", "qq_agent"]

[tool.setuptools.package-data]
pics = ["*.png"]
qq_agent = ["skills/**/*"]
